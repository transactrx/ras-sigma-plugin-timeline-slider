name: Deploy
on:
  push:
    branches: ["Development", "Production"]
    paths-ignore:
      - "*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}

          # Map branch to env prefix
          if [ "$branch" = "Development" ]; then
            ENV_PREFIX="DEV"
          else
            ENV_PREFIX="PROD"
          fi
          echo "ENV_PREFIX=${ENV_PREFIX}" >> $GITHUB_ENV

          # Plugin name derived from repo name (strip ras-sigma-plugin- prefix)
          REPO_NAME=$(echo ${GITHUB_REPOSITORY##*/})
          PLUGIN_NAME=${REPO_NAME#ras-sigma-plugin-}
          echo "PLUGIN_NAME=${PLUGIN_NAME}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ENV_PREFIX == 'DEV' && secrets.PROCESSOR_DEVELOPMENT_AWS_ROLE_ARN || secrets.PROCESSOR_PRODUCTION_AWS_ROLE_ARN }}
          role-session-name: sigma-plugin-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy assets to S3
        run: |
          aws s3 sync dist/ s3://${{ env.ENV_PREFIX == 'DEV' && vars.DEV_S3_BUCKET_NAME || vars.PROD_S3_BUCKET_NAME }}/${PLUGIN_NAME}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: Deploy index.html to S3
        run: |
          aws s3 cp dist/index.html s3://${{ env.ENV_PREFIX == 'DEV' && vars.DEV_S3_BUCKET_NAME || vars.PROD_S3_BUCKET_NAME }}/${PLUGIN_NAME}/index.html \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.ENV_PREFIX == 'DEV' && vars.DEV_CLOUDFRONT_DISTRIBUTION_ID || vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/${PLUGIN_NAME}/index.html"
