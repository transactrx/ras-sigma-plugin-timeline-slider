name: Deploy
on:
  push:
    branches: ["Development", "Production"]
    paths-ignore:
      - "*.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          branchUpper=$(echo ${branch^^})

          # AWS role ARN from secrets
          AWS_ROLE="SIGMA_${branchUpper}_AWS_ROLE_ARN"
          echo "AWS_ROLE=${AWS_ROLE}" >> $GITHUB_ENV

          # S3 bucket from variables
          S3_BUCKET="SIGMA_${branchUpper}_S3_BUCKET"
          echo "S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV

          # CloudFront distribution ID from variables
          CF_DIST="SIGMA_${branchUpper}_CLOUDFRONT_DISTRIBUTION_ID"
          echo "CF_DIST=${CF_DIST}" >> $GITHUB_ENV

          # Plugin name derived from repo name (strip ras-sigma-plugin- prefix)
          REPO_NAME=$(echo ${GITHUB_REPOSITORY##*/})
          PLUGIN_NAME=${REPO_NAME#ras-sigma-plugin-}
          echo "PLUGIN_NAME=${PLUGIN_NAME}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets[env.AWS_ROLE] }}
          role-session-name: sigma-plugin-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy assets to S3
        run: |
          aws s3 sync dist/ s3://${{ vars[env.S3_BUCKET] }}/${PLUGIN_NAME}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: Deploy index.html to S3
        run: |
          aws s3 cp dist/index.html s3://${{ vars[env.S3_BUCKET] }}/${PLUGIN_NAME}/index.html \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars[env.CF_DIST] }} \
            --paths "/${PLUGIN_NAME}/index.html"
